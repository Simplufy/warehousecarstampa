<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Florida Autohaus</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --primary: #1a2b4a;
      --accent: #d4a017;
      --success: #2d8a4e;
      --danger: #dc3545;
      --light: #f8f9fa;
      --gray: #6c757d;
      --radius: 10px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--light);
      color: #333;
    }

    .topbar {
      background: var(--primary);
      color: white;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .topbar h1 { font-size: 1.2rem; font-weight: 700; }
    .topbar h1 span { color: var(--accent); }
    .topbar a { color: rgba(255,255,255,0.8); text-decoration: none; font-size: 0.9rem; }
    .topbar a:hover { color: white; }

    /* TABS */
    .tabs {
      max-width: 1000px;
      margin: 24px auto 0;
      padding: 0 24px;
      display: flex;
      gap: 4px;
    }

    .tab {
      padding: 10px 20px;
      border-radius: 8px 8px 0 0;
      background: #e9ecef;
      border: none;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--gray);
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab.active {
      background: white;
      color: var(--primary);
    }

    .tab-badge {
      background: var(--danger);
      color: white;
      font-size: 0.7rem;
      padding: 2px 7px;
      border-radius: 10px;
      margin-left: 6px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 0 24px 32px;
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .card {
      background: white;
      border-radius: 0 var(--radius) var(--radius) var(--radius);
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      padding: 28px;
      margin-bottom: 24px;
    }

    .card h2 {
      font-size: 1.3rem;
      margin-bottom: 20px;
      color: var(--primary);
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      gap: 14px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-group label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--gray);
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      padding: 10px 12px;
      border: 2px solid #e9ecef;
      border-radius: 8px;
      font-size: 0.95rem;
      font-family: inherit;
      transition: border-color 0.2s;
    }

    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      outline: none;
      border-color: var(--primary);
    }

    .form-wide { grid-column: 1 / -1; }
    .form-half { grid-column: span 2; }

    textarea { resize: vertical; min-height: 70px; }

    .form-actions {
      grid-column: 1 / -1;
      display: flex;
      gap: 12px;
      margin-top: 8px;
    }

    .btn {
      padding: 10px 24px;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.85; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-success { background: var(--success); color: white; }
    .btn-danger { background: var(--danger); color: white; padding: 6px 14px; font-size: 0.85rem; }
    .btn-edit { background: var(--primary); color: white; padding: 6px 14px; font-size: 0.85rem; }
    .btn-cancel { background: #e9ecef; color: var(--gray); }
    .btn-small { padding: 4px 10px; font-size: 0.78rem; }

    .checkbox-group {
      flex-direction: row !important;
      align-items: center;
      gap: 8px;
    }
    .checkbox-group input { width: 18px; height: 18px; }
    .checkbox-group label { margin: 0; font-size: 0.9rem; text-transform: none; }

    /* MULTI-IMAGE UPLOAD */
    .image-upload-area {
      border: 2px dashed #dee2e6;
      border-radius: 10px;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s;
      position: relative;
    }
    .image-upload-area:hover { border-color: var(--primary); }
    .image-upload-area input { display: none; }
    .image-upload-label {
      font-size: 0.9rem;
      color: var(--gray);
    }
    .image-upload-label strong { color: var(--primary); }

    .image-thumbs {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .image-thumb-wrap {
      position: relative;
      width: 90px;
      height: 64px;
    }

    .image-thumb-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 6px;
    }

    .image-thumb-remove {
      position: absolute;
      top: -6px;
      right: -6px;
      background: var(--danger);
      color: white;
      border: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      font-size: 0.7rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* HIGHLIGHTS HELPER */
    .highlights-help {
      font-size: 0.78rem;
      color: var(--gray);
      margin-top: 4px;
    }

    /* TABLE */
    .inv-table { width: 100%; border-collapse: collapse; }
    .inv-table th {
      text-align: left;
      padding: 10px 12px;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--gray);
      border-bottom: 2px solid #e9ecef;
    }
    .inv-table td { padding: 12px; border-bottom: 1px solid #f0f0f0; vertical-align: middle; }
    .inv-table tr:hover { background: #fafafa; }

    .inv-img { width: 80px; height: 54px; object-fit: cover; border-radius: 6px; background: #e9ecef; }
    .inv-img-placeholder {
      width: 80px; height: 54px; background: #e9ecef; border-radius: 6px;
      display: flex; align-items: center; justify-content: center; font-size: 1.5rem; color: var(--gray);
    }

    .actions { display: flex; gap: 8px; }
    .car-count { color: var(--gray); font-size: 0.9rem; margin-bottom: 16px; }

    .msg {
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-weight: 500;
      display: none;
    }
    .msg-success { background: #d4edda; color: #155724; }
    .msg-error { background: #f8d7da; color: #721c24; }

    /* MESSAGES TAB */
    .message-card {
      background: white;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      margin-bottom: 14px;
      border-left: 4px solid var(--primary);
    }

    .message-card.unread { border-left-color: var(--accent); background: #fffef5; }

    .message-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .message-from { font-weight: 700; color: var(--primary); }
    .message-date { color: var(--gray); font-size: 0.85rem; }
    .message-contact { font-size: 0.88rem; color: var(--gray); margin-bottom: 8px; }
    .message-interest {
      display: inline-block;
      background: #e8f5e9;
      color: var(--success);
      font-size: 0.82rem;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 20px;
      margin-bottom: 8px;
    }
    .message-body { font-size: 0.92rem; line-height: 1.6; color: #444; }
    .message-actions { margin-top: 12px; display: flex; gap: 8px; }

    .no-messages {
      text-align: center;
      padding: 40px;
      color: var(--gray);
    }

    @media (max-width: 768px) {
      .form-grid { grid-template-columns: 1fr 1fr; }
      .form-half { grid-column: span 2; }
      .inv-table { font-size: 0.85rem; }
      .inv-table td, .inv-table th { padding: 8px 6px; }
    }

    @media (max-width: 480px) {
      .form-grid { grid-template-columns: 1fr; }
      .form-half { grid-column: span 1; }
    }
  </style>
</head>
<body>

  <div class="topbar">
    <h1>Admin <span>Panel</span></h1>
    <a href="/">&#8592; View Website</a>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('inventory')">Inventory</button>
    <button class="tab" onclick="switchTab('messages')" id="messages-tab">Messages <span class="tab-badge" id="msg-badge" style="display:none">0</span></button>
  </div>

  <div class="container">
    <div id="message" class="msg"></div>

    <!-- INVENTORY TAB -->
    <div class="tab-content active" id="tab-inventory">
      <div class="card">
        <h2 id="form-title">Add New Car</h2>
        <form id="car-form" enctype="multipart/form-data">
          <input type="hidden" id="edit-id" value="">
          <div class="form-grid">
            <div class="form-group">
              <label>Year *</label>
              <input type="number" id="year" min="1990" max="2027" required placeholder="2020">
            </div>
            <div class="form-group">
              <label>Make *</label>
              <input type="text" id="make" required placeholder="Toyota" list="makes-list">
              <datalist id="makes-list">
                <option value="Toyota"><option value="Honda"><option value="Nissan">
                <option value="Chevrolet"><option value="Ford"><option value="Hyundai">
                <option value="Kia"><option value="Jeep"><option value="Dodge">
                <option value="BMW"><option value="Mercedes-Benz"><option value="Lexus">
                <option value="Mazda"><option value="Subaru"><option value="Volkswagen">
              </datalist>
            </div>
            <div class="form-group">
              <label>Model *</label>
              <input type="text" id="model" required placeholder="Camry">
            </div>
            <div class="form-group">
              <label>Price *</label>
              <input type="number" id="price" min="0" required placeholder="15000">
            </div>
            <div class="form-group">
              <label>Mileage</label>
              <input type="number" id="mileage" min="0" placeholder="45000">
            </div>
            <div class="form-group">
              <label>Color</label>
              <input type="text" id="color" placeholder="Silver">
            </div>
            <div class="form-group">
              <label>Body Style</label>
              <select id="body_style">
                <option value="">Select...</option>
                <option value="Sedan">Sedan</option>
                <option value="SUV">SUV</option>
                <option value="Truck">Truck</option>
                <option value="Coupe">Coupe</option>
                <option value="Hatchback">Hatchback</option>
                <option value="Van">Van</option>
                <option value="Convertible">Convertible</option>
                <option value="Wagon">Wagon</option>
              </select>
            </div>
            <div class="form-group">
              <label>Drivetrain</label>
              <select id="drivetrain">
                <option value="">Select...</option>
                <option value="FWD">FWD</option>
                <option value="RWD">RWD</option>
                <option value="AWD">AWD</option>
                <option value="4WD">4WD</option>
              </select>
            </div>
            <div class="form-group">
              <label>Transmission</label>
              <select id="transmission">
                <option value="">Select...</option>
                <option value="Automatic">Automatic</option>
                <option value="Manual">Manual</option>
                <option value="CVT">CVT</option>
              </select>
            </div>
            <div class="form-group">
              <label>Fuel Type</label>
              <select id="fuel_type">
                <option value="">Select...</option>
                <option value="Gasoline">Gasoline</option>
                <option value="Diesel">Diesel</option>
                <option value="Hybrid">Hybrid</option>
                <option value="Electric">Electric</option>
              </select>
            </div>
            <div class="form-group">
              <label>Engine</label>
              <input type="text" id="engine" placeholder="2.5L 4-Cylinder">
            </div>
            <div class="form-group">
              <label>VIN</label>
              <input type="text" id="vin" placeholder="1HGBH41JXMN109186">
            </div>
            <div class="form-group checkbox-group">
              <input type="checkbox" id="featured">
              <label for="featured">Featured Vehicle</label>
            </div>

            <!-- Multi-image upload -->
            <div class="form-group form-wide">
              <label>Photos (select multiple)</label>
              <div class="image-upload-area" id="upload-area">
                <input type="file" id="images" accept="image/jpeg,image/png,image/webp" multiple>
                <div class="image-upload-label">
                  <strong>Click to upload photos</strong><br>
                  JPG, PNG or WebP &bull; Up to 5MB each &bull; Select multiple
                </div>
              </div>
              <div class="image-thumbs" id="image-thumbs"></div>
              <div class="image-thumbs" id="existing-images"></div>
            </div>

            <div class="form-group form-wide">
              <label>Highlights</label>
              <textarea id="highlights" placeholder="Clean title, one owner&#10;Backup camera and Apple CarPlay&#10;Great fuel economy"></textarea>
              <div class="highlights-help">One highlight per line. These appear as bullet points on the listing.</div>
            </div>
            <div class="form-group form-wide">
              <label>Description</label>
              <textarea id="description" placeholder="Clean title, one owner, well maintained..."></textarea>
            </div>
            <div class="form-actions">
              <button type="submit" class="btn btn-success" id="submit-btn">Add Car</button>
              <button type="button" class="btn btn-cancel" id="cancel-btn" style="display:none" onclick="cancelEdit()">Cancel</button>
            </div>
          </div>
        </form>
      </div>

      <div class="card">
        <h2>Current Inventory</h2>
        <p class="car-count" id="inv-count"></p>
        <div style="overflow-x:auto;">
          <table class="inv-table">
            <thead>
              <tr>
                <th>Photo</th>
                <th>Vehicle</th>
                <th>Price</th>
                <th>Mileage</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="inv-body">
              <tr><td colspan="5" style="text-align:center;padding:32px;color:#999;">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- MESSAGES TAB -->
    <div class="tab-content" id="tab-messages">
      <div class="card" style="border-radius:var(--radius);">
        <h2>Contact Messages</h2>
        <div id="messages-list">
          <div class="no-messages">Loading...</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('car-form');
    const invBody = document.getElementById('inv-body');
    const msgEl = document.getElementById('message');
    let editingId = null;
    let selectedFiles = [];

    function showMsg(text, type) {
      msgEl.textContent = text;
      msgEl.className = `msg msg-${type}`;
      msgEl.style.display = 'block';
      setTimeout(() => { msgEl.style.display = 'none'; }, 3000);
    }

    // TABS
    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      document.getElementById(`tab-${tab}`).classList.add('active');
      event.target.classList.add('active');
      if (tab === 'messages') loadMessages();
    }

    // IMAGE UPLOAD HANDLING
    const uploadArea = document.getElementById('upload-area');
    const fileInput = document.getElementById('images');

    uploadArea.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', function () {
      for (const file of this.files) {
        selectedFiles.push(file);
      }
      renderImageThumbs();
      this.value = '';
    });

    function renderImageThumbs() {
      const container = document.getElementById('image-thumbs');
      container.innerHTML = selectedFiles.map((file, i) => {
        const url = URL.createObjectURL(file);
        return `<div class="image-thumb-wrap">
          <img src="${url}" alt="Photo ${i + 1}">
          <button class="image-thumb-remove" onclick="removeNewImage(${i})" type="button">&times;</button>
        </div>`;
      }).join('');
    }

    function removeNewImage(idx) {
      selectedFiles.splice(idx, 1);
      renderImageThumbs();
    }

    // INVENTORY
    async function loadInventory() {
      const res = await fetch('/api/cars');
      const cars = await res.json();
      document.getElementById('inv-count').textContent = `${cars.length} vehicle${cars.length !== 1 ? 's' : ''} in inventory`;

      if (cars.length === 0) {
        invBody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:32px;color:#999;">No cars yet. Add your first car above!</td></tr>';
        return;
      }

      invBody.innerHTML = cars.map(car => `
        <tr>
          <td>
            ${car.image
              ? `<img class="inv-img" src="${car.image}" alt="${car.make} ${car.model}">`
              : `<div class="inv-img-placeholder">&#128663;</div>`}
          </td>
          <td>
            <strong>${car.year} ${car.make} ${car.model}</strong>
            ${car.color ? `<br><small style="color:#999">${car.color}</small>` : ''}
            ${car.featured ? ' <small style="color:var(--accent);font-weight:700;">&#9733; Featured</small>' : ''}
            ${car.images && car.images.length > 1 ? `<br><small style="color:var(--gray);">${car.images.length} photos</small>` : ''}
          </td>
          <td><strong>$${car.price.toLocaleString()}</strong></td>
          <td>${car.mileage ? car.mileage.toLocaleString() + ' mi' : '&#8212;'}</td>
          <td class="actions">
            <a href="/car/${car.id}" class="btn btn-small" style="background:#e9ecef;color:var(--primary);" target="_blank">View</a>
            <button class="btn btn-edit" onclick="startEdit(${car.id})">Edit</button>
            <button class="btn btn-danger" onclick="deleteCar(${car.id}, '${car.year} ${car.make} ${car.model}')">Delete</button>
          </td>
        </tr>
      `).join('');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData();
      formData.append('year', document.getElementById('year').value);
      formData.append('make', document.getElementById('make').value);
      formData.append('model', document.getElementById('model').value);
      formData.append('price', document.getElementById('price').value);
      formData.append('mileage', document.getElementById('mileage').value);
      formData.append('color', document.getElementById('color').value);
      formData.append('description', document.getElementById('description').value);
      formData.append('featured', document.getElementById('featured').checked ? 1 : 0);
      formData.append('drivetrain', document.getElementById('drivetrain').value);
      formData.append('transmission', document.getElementById('transmission').value);
      formData.append('engine', document.getElementById('engine').value);
      formData.append('fuel_type', document.getElementById('fuel_type').value);
      formData.append('body_style', document.getElementById('body_style').value);
      formData.append('vin', document.getElementById('vin').value);
      formData.append('highlights', document.getElementById('highlights').value);

      for (const file of selectedFiles) {
        formData.append('images', file);
      }

      try {
        let url = '/api/cars';
        let method = 'POST';
        if (editingId) {
          url = `/api/cars/${editingId}`;
          method = 'PUT';
        }

        const res = await fetch(url, { method, body: formData });
        const data = await res.json();

        if (res.ok) {
          showMsg(editingId ? 'Car updated!' : 'Car added!', 'success');
          form.reset();
          selectedFiles = [];
          renderImageThumbs();
          cancelEdit();
          loadInventory();
        } else {
          showMsg(data.error || 'Something went wrong', 'error');
        }
      } catch (err) {
        showMsg('Failed to save. Try again.', 'error');
      }
    });

    async function startEdit(id) {
      const res = await fetch(`/api/cars/${id}`);
      const car = await res.json();
      editingId = id;

      document.getElementById('year').value = car.year;
      document.getElementById('make').value = car.make;
      document.getElementById('model').value = car.model;
      document.getElementById('price').value = car.price;
      document.getElementById('mileage').value = car.mileage || '';
      document.getElementById('color').value = car.color || '';
      document.getElementById('description').value = car.description || '';
      document.getElementById('featured').checked = car.featured;
      document.getElementById('drivetrain').value = car.drivetrain || '';
      document.getElementById('transmission').value = car.transmission || '';
      document.getElementById('engine').value = car.engine || '';
      document.getElementById('fuel_type').value = car.fuel_type || '';
      document.getElementById('body_style').value = car.body_style || '';
      document.getElementById('vin').value = car.vin || '';
      document.getElementById('highlights').value = car.highlights || '';

      document.getElementById('form-title').textContent = `Editing: ${car.year} ${car.make} ${car.model}`;
      document.getElementById('submit-btn').textContent = 'Update Car';
      document.getElementById('cancel-btn').style.display = 'inline-block';

      // Show existing images with delete buttons
      const imgRes = await fetch(`/api/cars/${id}/images`);
      const images = await imgRes.json();
      const existingEl = document.getElementById('existing-images');
      existingEl.innerHTML = images.map(img => `
        <div class="image-thumb-wrap" id="existing-img-${img.id}">
          <img src="${img.image_path}" alt="Photo">
          <button class="image-thumb-remove" onclick="deleteExistingImage(${id}, ${img.id})" type="button">&times;</button>
        </div>
      `).join('');

      selectedFiles = [];
      renderImageThumbs();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function deleteExistingImage(carId, imageId) {
      if (!confirm('Delete this photo?')) return;
      await fetch(`/api/cars/${carId}/images/${imageId}`, { method: 'DELETE' });
      const el = document.getElementById(`existing-img-${imageId}`);
      if (el) el.remove();
      showMsg('Photo deleted', 'success');
    }

    function cancelEdit() {
      editingId = null;
      form.reset();
      selectedFiles = [];
      renderImageThumbs();
      document.getElementById('form-title').textContent = 'Add New Car';
      document.getElementById('submit-btn').textContent = 'Add Car';
      document.getElementById('cancel-btn').style.display = 'none';
      document.getElementById('existing-images').innerHTML = '';
    }

    async function deleteCar(id, name) {
      if (!confirm(`Delete ${name}? This cannot be undone.`)) return;
      try {
        const res = await fetch(`/api/cars/${id}`, { method: 'DELETE' });
        if (res.ok) {
          showMsg('Car deleted.', 'success');
          loadInventory();
        }
      } catch (err) {
        showMsg('Failed to delete. Try again.', 'error');
      }
    }

    // MESSAGES
    async function loadMessages() {
      const res = await fetch('/api/messages');
      const messages = await res.json();
      const unread = messages.filter(m => !m.read).length;

      const badge = document.getElementById('msg-badge');
      if (unread > 0) {
        badge.textContent = unread;
        badge.style.display = 'inline';
      } else {
        badge.style.display = 'none';
      }

      const list = document.getElementById('messages-list');
      if (messages.length === 0) {
        list.innerHTML = '<div class="no-messages">No messages yet.</div>';
        return;
      }

      list.innerHTML = messages.map(m => `
        <div class="message-card ${m.read ? '' : 'unread'}">
          <div class="message-header">
            <span class="message-from">${m.name}</span>
            <span class="message-date">${new Date(m.created_at).toLocaleString()}</span>
          </div>
          <div class="message-contact">${m.email}${m.phone ? ' &bull; ' + m.phone : ''}</div>
          ${m.car_interest ? `<div class="message-interest">Interested in: ${m.car_interest}</div>` : ''}
          <div class="message-body">${m.message}</div>
          <div class="message-actions">
            ${m.read ? '' : `<button class="btn btn-small btn-primary" onclick="markRead(${m.id})">Mark Read</button>`}
            <button class="btn btn-small btn-danger" onclick="deleteMessage(${m.id})">Delete</button>
          </div>
        </div>
      `).join('');
    }

    async function markRead(id) {
      await fetch(`/api/messages/${id}/read`, { method: 'PUT' });
      loadMessages();
    }

    async function deleteMessage(id) {
      if (!confirm('Delete this message?')) return;
      await fetch(`/api/messages/${id}`, { method: 'DELETE' });
      loadMessages();
    }

    // Init
    loadInventory();
    // Check for unread messages
    fetch('/api/messages').then(r => r.json()).then(msgs => {
      const unread = msgs.filter(m => !m.read).length;
      if (unread > 0) {
        document.getElementById('msg-badge').textContent = unread;
        document.getElementById('msg-badge').style.display = 'inline';
      }
    }).catch(() => {});
  </script>

</body>
</html>
