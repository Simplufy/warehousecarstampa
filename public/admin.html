<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Warehouse Cars Tampa</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --primary: #1a2b4a;
      --accent: #d4a017;
      --success: #2d8a4e;
      --danger: #dc3545;
      --light: #f8f9fa;
      --gray: #6c757d;
      --radius: 10px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--light);
      color: #333;
    }

    /* TOP BAR */
    .topbar {
      background: var(--primary);
      color: white;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .topbar h1 {
      font-size: 1.2rem;
      font-weight: 700;
    }

    .topbar h1 span { color: var(--accent); }

    .topbar a {
      color: rgba(255,255,255,0.8);
      text-decoration: none;
      font-size: 0.9rem;
    }

    .topbar a:hover { color: white; }

    /* LAYOUT */
    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 32px 24px;
    }

    /* ADD CAR FORM */
    .card {
      background: white;
      border-radius: var(--radius);
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      padding: 28px;
      margin-bottom: 32px;
    }

    .card h2 {
      font-size: 1.3rem;
      margin-bottom: 20px;
      color: var(--primary);
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      gap: 14px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-group label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--gray);
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      padding: 10px 12px;
      border: 2px solid #e9ecef;
      border-radius: 8px;
      font-size: 0.95rem;
      font-family: inherit;
      transition: border-color 0.2s;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: var(--primary);
    }

    .form-wide { grid-column: 1 / -1; }
    .form-half { grid-column: span 2; }

    textarea { resize: vertical; min-height: 70px; }

    .form-actions {
      grid-column: 1 / -1;
      display: flex;
      gap: 12px;
      margin-top: 8px;
    }

    .btn {
      padding: 10px 24px;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn:hover { opacity: 0.85; }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-success {
      background: var(--success);
      color: white;
    }

    .btn-danger {
      background: var(--danger);
      color: white;
      padding: 6px 14px;
      font-size: 0.85rem;
    }

    .btn-edit {
      background: var(--primary);
      color: white;
      padding: 6px 14px;
      font-size: 0.85rem;
    }

    .btn-cancel {
      background: #e9ecef;
      color: var(--gray);
    }

    /* CHECKBOX */
    .checkbox-group {
      flex-direction: row !important;
      align-items: center;
      gap: 8px;
    }

    .checkbox-group input {
      width: 18px;
      height: 18px;
    }

    .checkbox-group label {
      margin: 0;
      font-size: 0.9rem;
      text-transform: none;
    }

    /* IMAGE PREVIEW */
    .image-preview {
      margin-top: 8px;
    }

    .image-preview img {
      max-width: 150px;
      border-radius: 8px;
    }

    /* INVENTORY TABLE */
    .inv-table {
      width: 100%;
      border-collapse: collapse;
    }

    .inv-table th {
      text-align: left;
      padding: 10px 12px;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--gray);
      border-bottom: 2px solid #e9ecef;
    }

    .inv-table td {
      padding: 12px;
      border-bottom: 1px solid #f0f0f0;
      vertical-align: middle;
    }

    .inv-table tr:hover { background: #fafafa; }

    .inv-img {
      width: 80px;
      height: 54px;
      object-fit: cover;
      border-radius: 6px;
      background: #e9ecef;
    }

    .inv-img-placeholder {
      width: 80px;
      height: 54px;
      background: #e9ecef;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      color: var(--gray);
    }

    .actions { display: flex; gap: 8px; }

    .car-count {
      color: var(--gray);
      font-size: 0.9rem;
      margin-bottom: 16px;
    }

    .msg {
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-weight: 500;
      display: none;
    }

    .msg-success { background: #d4edda; color: #155724; }
    .msg-error { background: #f8d7da; color: #721c24; }

    @media (max-width: 768px) {
      .form-grid { grid-template-columns: 1fr 1fr; }
      .form-half { grid-column: span 2; }
      .inv-table { font-size: 0.85rem; }
      .inv-table td, .inv-table th { padding: 8px 6px; }
    }

    @media (max-width: 480px) {
      .form-grid { grid-template-columns: 1fr; }
      .form-half { grid-column: span 1; }
    }
  </style>
</head>
<body>

  <div class="topbar">
    <h1>Admin <span>Panel</span></h1>
    <a href="/">&#8592; View Website</a>
  </div>

  <div class="container">
    <div id="message" class="msg"></div>

    <!-- ADD/EDIT FORM -->
    <div class="card">
      <h2 id="form-title">Add New Car</h2>
      <form id="car-form" enctype="multipart/form-data">
        <input type="hidden" id="edit-id" value="">
        <div class="form-grid">
          <div class="form-group">
            <label>Year *</label>
            <input type="number" id="year" min="1990" max="2027" required placeholder="2020">
          </div>
          <div class="form-group">
            <label>Make *</label>
            <input type="text" id="make" required placeholder="Toyota" list="makes-list">
            <datalist id="makes-list">
              <option value="Toyota">
              <option value="Honda">
              <option value="Nissan">
              <option value="Chevrolet">
              <option value="Ford">
              <option value="Hyundai">
              <option value="Kia">
              <option value="Jeep">
              <option value="Dodge">
              <option value="BMW">
              <option value="Mercedes-Benz">
              <option value="Lexus">
              <option value="Mazda">
              <option value="Subaru">
              <option value="Volkswagen">
            </datalist>
          </div>
          <div class="form-group">
            <label>Model *</label>
            <input type="text" id="model" required placeholder="Camry">
          </div>
          <div class="form-group">
            <label>Price *</label>
            <input type="number" id="price" min="0" required placeholder="15000">
          </div>
          <div class="form-group">
            <label>Mileage</label>
            <input type="number" id="mileage" min="0" placeholder="45000">
          </div>
          <div class="form-group">
            <label>Color</label>
            <input type="text" id="color" placeholder="Silver">
          </div>
          <div class="form-group checkbox-group">
            <input type="checkbox" id="featured">
            <label for="featured">Featured Vehicle</label>
          </div>
          <div class="form-group">
            <label>Photo</label>
            <input type="file" id="image" accept="image/jpeg,image/png,image/webp">
            <div class="image-preview" id="image-preview"></div>
          </div>
          <div class="form-group form-wide">
            <label>Description</label>
            <textarea id="description" placeholder="Clean title, one owner, well maintained..."></textarea>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn-success" id="submit-btn">Add Car</button>
            <button type="button" class="btn btn-cancel" id="cancel-btn" style="display:none" onclick="cancelEdit()">Cancel</button>
          </div>
        </div>
      </form>
    </div>

    <!-- INVENTORY LIST -->
    <div class="card">
      <h2>Current Inventory</h2>
      <p class="car-count" id="inv-count"></p>
      <div style="overflow-x:auto;">
        <table class="inv-table">
          <thead>
            <tr>
              <th>Photo</th>
              <th>Vehicle</th>
              <th>Price</th>
              <th>Mileage</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="inv-body">
            <tr><td colspan="5" style="text-align:center;padding:32px;color:#999;">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('car-form');
    const invBody = document.getElementById('inv-body');
    const msgEl = document.getElementById('message');
    let editingId = null;

    function showMsg(text, type) {
      msgEl.textContent = text;
      msgEl.className = `msg msg-${type}`;
      msgEl.style.display = 'block';
      setTimeout(() => { msgEl.style.display = 'none'; }, 3000);
    }

    async function loadInventory() {
      const res = await fetch('/api/cars');
      const cars = await res.json();
      document.getElementById('inv-count').textContent = `${cars.length} vehicle${cars.length !== 1 ? 's' : ''} in inventory`;

      if (cars.length === 0) {
        invBody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:32px;color:#999;">No cars yet. Add your first car above!</td></tr>';
        return;
      }

      invBody.innerHTML = cars.map(car => `
        <tr>
          <td>
            ${car.image
              ? `<img class="inv-img" src="${car.image}" alt="${car.make} ${car.model}">`
              : `<div class="inv-img-placeholder">&#128663;</div>`}
          </td>
          <td>
            <strong>${car.year} ${car.make} ${car.model}</strong>
            ${car.color ? `<br><small style="color:#999">${car.color}</small>` : ''}
            ${car.featured ? ' <small style="color:var(--accent);font-weight:700;">&#9733; Featured</small>' : ''}
          </td>
          <td><strong>$${car.price.toLocaleString()}</strong></td>
          <td>${car.mileage ? car.mileage.toLocaleString() + ' mi' : '—'}</td>
          <td class="actions">
            <button class="btn btn-edit" onclick="startEdit(${car.id})">Edit</button>
            <button class="btn btn-danger" onclick="deleteCar(${car.id}, '${car.year} ${car.make} ${car.model}')">Delete</button>
          </td>
        </tr>
      `).join('');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData();
      formData.append('year', document.getElementById('year').value);
      formData.append('make', document.getElementById('make').value);
      formData.append('model', document.getElementById('model').value);
      formData.append('price', document.getElementById('price').value);
      formData.append('mileage', document.getElementById('mileage').value);
      formData.append('color', document.getElementById('color').value);
      formData.append('description', document.getElementById('description').value);
      formData.append('featured', document.getElementById('featured').checked ? 1 : 0);

      const imageFile = document.getElementById('image').files[0];
      if (imageFile) formData.append('image', imageFile);

      try {
        let url = '/api/cars';
        let method = 'POST';
        if (editingId) {
          url = `/api/cars/${editingId}`;
          method = 'PUT';
        }

        const res = await fetch(url, { method, body: formData });
        const data = await res.json();

        if (res.ok) {
          showMsg(editingId ? 'Car updated!' : 'Car added!', 'success');
          form.reset();
          cancelEdit();
          loadInventory();
        } else {
          showMsg(data.error || 'Something went wrong', 'error');
        }
      } catch (err) {
        showMsg('Failed to save. Try again.', 'error');
      }
    });

    async function startEdit(id) {
      const res = await fetch(`/api/cars/${id}`);
      const car = await res.json();
      editingId = id;

      document.getElementById('year').value = car.year;
      document.getElementById('make').value = car.make;
      document.getElementById('model').value = car.model;
      document.getElementById('price').value = car.price;
      document.getElementById('mileage').value = car.mileage || '';
      document.getElementById('color').value = car.color || '';
      document.getElementById('description').value = car.description || '';
      document.getElementById('featured').checked = car.featured;

      document.getElementById('form-title').textContent = `Editing: ${car.year} ${car.make} ${car.model}`;
      document.getElementById('submit-btn').textContent = 'Update Car';
      document.getElementById('cancel-btn').style.display = 'inline-block';

      if (car.image) {
        document.getElementById('image-preview').innerHTML = `<img src="${car.image}" alt="Current photo">`;
      }

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function cancelEdit() {
      editingId = null;
      form.reset();
      document.getElementById('form-title').textContent = 'Add New Car';
      document.getElementById('submit-btn').textContent = 'Add Car';
      document.getElementById('cancel-btn').style.display = 'none';
      document.getElementById('image-preview').innerHTML = '';
    }

    async function deleteCar(id, name) {
      if (!confirm(`Delete ${name}? This cannot be undone.`)) return;
      try {
        const res = await fetch(`/api/cars/${id}`, { method: 'DELETE' });
        if (res.ok) {
          showMsg('Car deleted.', 'success');
          loadInventory();
        }
      } catch (err) {
        showMsg('Failed to delete. Try again.', 'error');
      }
    }

    // Image preview
    document.getElementById('image').addEventListener('change', function () {
      const file = this.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (e) => {
          document.getElementById('image-preview').innerHTML = `<img src="${e.target.result}" alt="Preview">`;
        };
        reader.readAsDataURL(file);
      }
    });

    loadInventory();
  </script>

</body>
</html>
